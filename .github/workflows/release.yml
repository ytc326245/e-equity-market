name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            iphone/package-lock.json
      - run: npm ci
      - run: npm ci --prefix iphone
      - run: npm run check
      - run: npm test
      - run: npm run test:mobile
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          if($env:GITHUB_REF_NAME -ne "v$version"){throw 'Tag and package version do not match'}
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged program and compute checksum
        shell: pwsh
        run: |
          $env:EEQUITY_DATA_DIR=Join-Path $env:RUNNER_TEMP 'equity-check-account'
          $env:EEQUITY_SELF_CHECK_REPORT=Join-Path $env:RUNNER_TEMP 'equity-self-check.json'
          $p=Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE 'release/win-unpacked/E-Equity.exe') -ArgumentList '--self-check' -WindowStyle Hidden -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Packaged application check failed'}
          $report=Get-Content $env:EEQUITY_SELF_CHECK_REPORT -Raw | ConvertFrom-Json
          if(-not $report.ok){throw 'Invalid self-check report'}
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $file="E-Equity-Setup-$version-x64.exe"
          $hash=(Get-FileHash -LiteralPath (Join-Path release $file) -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Set-Content -Encoding utf8 release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e-equity-windows
          path: |
            release/E-Equity-Setup-*-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/E-Equity-Setup-*-x64.exe
            release/SHA256SUMS.txt
